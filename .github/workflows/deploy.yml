name: Deploy Sphinx Site to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the build every time you push code to the main branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches a stable modern Python environment

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx myst-parser pydata-sphinx-theme sphinx-design

      - name: Setup Pages Artifact Properties
        uses: actions/configure-pages@v5

      - name: Build HTML Website
        run: |
          # Compiles source files directly into a flat directory structure
          python -m sphinx.cmd.build -b html source _build/html

      - name: Upload HTML Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
